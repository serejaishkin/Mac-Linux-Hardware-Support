  storage:
    candidates:
      - nvme
      - ahci
  thunderbolt:
    driver: thunderbolt
  display:
    backlight: linux-backlight
  power:
    subsystems:
      - thermal
      - hwmon
      - cpufreq
      - suspend-resume

testing:
  distributions:
