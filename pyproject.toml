[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-linux-hardware-support"
version = "0.7.0"
description = "Hardware detection and compatibility tooling for Apple hardware on Linux"
requires-python = ">=3.9"
license = { text = "License pending" }
dependencies = []

[project.scripts]
maclinux = "maclinux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
